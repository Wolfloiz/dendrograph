<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Timeline — dendrograph</title>
<link rel="stylesheet" href="style.css">
<script src="theme.js"></script>
<style>
  .lanes { position: relative; padding-top: 1.6rem; }
  .axis { position: relative; height: 1.4rem; margin-left: var(--lbl);
          border-bottom: 1px solid var(--border); }
  .axis span { position: absolute; top: 0.1rem; transform: translateX(-50%);
               font-size: 0.72rem; color: var(--text-muted); }
  .markerline { position: absolute; top: 0; bottom: 0; width: 0;
                border-left: 2px dashed var(--c-marker); pointer-events: none; }
  .markerline i { position: absolute; top: -1.35rem; left: 0.4rem;
                  font-style: normal; font-size: 0.73rem; color: var(--c-marker);
                  white-space: nowrap; font-weight: 500; }
  .grouphead { display: flex; align-items: center; gap: 0.5rem;
               margin: 1.4rem 0 0.5rem; font-size: 0.76rem; font-weight: 600;
               letter-spacing: 0.05em; text-transform: uppercase;
               color: var(--text-secondary); }
  .grouphead .ct { color: var(--text-muted); font-weight: 400;
                   letter-spacing: 0; text-transform: none; }
  .row { display: flex; align-items: center; height: 1.7rem; position: relative; }
  .row:hover { background: var(--grid); border-radius: 0.35rem; }
  .lbl { width: var(--lbl); flex: none; font-size: 0.81rem;
         color: var(--text-secondary); white-space: nowrap; overflow: hidden;
         text-overflow: ellipsis; padding-right: 0.85rem; }
  .row.fork .lbl { color: var(--text-muted); font-style: normal; }
  .row.aliased .lbl { font-style: italic; }
  .track { position: relative; flex: 1; height: 100%; }
  .track::before { content: ""; position: absolute; inset: 0;
                   background: repeating-linear-gradient(to right,
                     var(--grid) 0 1px, transparent 1px var(--step)); }
  .lane-mark { position: absolute; top: 50%; transform: translateY(-50%);
               border-radius: 999px; background: var(--c-artifact);
               box-shadow: 0 0 0 2px var(--surface-1); }
  .bar { height: 0.65rem; }
  .dot { width: 0.6rem; height: 0.6rem;
         transform: translate(-50%, -50%); border-radius: 50%; }
  .row.fork .lane-mark { background: transparent;
                         border: 1.5px dashed var(--fork); }
  .row.aliased .lane-mark { background: var(--accent-soft);
                            border: 1.5px solid var(--accent); }
  .controls { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center;
              margin-bottom: 1.15rem; }
  .chipf { display: inline-flex; align-items: center; gap: 0.45rem;
           background: var(--surface-1); border: 1px solid var(--border);
           border-radius: 999px; padding: 0.3rem 0.85rem; font-size: 0.82rem;
           color: var(--text-secondary); cursor: pointer; font-family: inherit;
           transition: border-color 120ms ease, color 120ms ease,
                       transform 100ms ease-out; }
  .chipf:hover { color: var(--text-primary); border-color: var(--text-muted); }
  .chipf:active { transform: scale(0.97); }
  .chipf[aria-pressed="true"] { border-color: var(--text-muted);
                                color: var(--text-primary); }
  .chipf[aria-pressed="false"] .sw { opacity: 0.3; }
  .chipf .sw { width: 0.65rem; height: 0.65rem; border-radius: 3px; flex: none; }
  #tip { position: fixed; z-index: 9; pointer-events: none; opacity: 0;
         transition: opacity 100ms ease; background: var(--surface-1);
         border: 1px solid var(--border); border-radius: 0.65rem;
         padding: 0.7rem 0.85rem; max-width: 21rem; font-size: 0.81rem;
         line-height: 1.45; box-shadow: var(--shadow); }
  #tip h4 { margin: 0 0 0.3rem; font-size: 0.88rem; font-weight: 620; }
  #tip .m { color: var(--text-secondary); margin: 0.15rem 0; }
  #tip .d { color: var(--text-muted); margin-top: 0.4rem; font-style: italic; }
  .note { color: var(--text-muted); font-size: 0.8rem; margin: 0.9rem 0 0; }
  .tools { margin-top: 2.5rem; border-top: 1px solid var(--border);
           padding-top: 1.5rem; }
  .tools h2 { font-size: 1rem; margin: 0 0 0.6rem; letter-spacing: -0.01em; }
  td.span { font-family: "IBM Plex Mono", ui-monospace, monospace;
            font-size: 0.8rem; }
  td.basis { font-size: 0.78rem; color: var(--text-muted); }
  tr.expandable { cursor: pointer; }
  tr.expandable:hover td { background: var(--grid); }
  tr.detail td { padding: 0.3rem 0.6rem 0.7rem; background: transparent; }
  .atchip { display: inline-block; border: 1px solid var(--border);
            border-radius: 999px; padding: 0.1rem 0.6rem; font-size: 0.78rem;
            margin: 0.2rem 0.3rem 0.2rem 0; color: var(--text-secondary); }
  @media (max-width: 50rem) { :root { --lbl: 9rem; } }
</style>

<script src="graph.js"></script>
<script src="loader.js"></script>
<body>
<div class="wrap">
<header>
  <div>
    <p class="eyebrow">dendrograph</p>
    <h1>Archive timeline</h1>
    <p class="sub" id="meta"></p>
  </div>
  <nav>
    <a href="timeline.html" aria-current="page">Timeline</a>
    <a href="graph.html">Graph</a>
    <button class="btn" id="theme" type="button" title="Toggle light/dark">Theme</button>
  </nav>
</header>

<div class="tiles" id="tiles"></div>
<div id="notices"></div>
<div class="controls" id="controls"></div>

<div class="panel">
  <div class="axis" id="axis"></div>
  <div class="lanes" id="lanes"></div>
  <p class="note" id="note"></p>
</div>

<section class="tools">
  <h2>Tools, and how long</h2>
  <table id="tools"><thead><tr>
    <th>Tool</th><th>First</th><th>Last</th><th class="n">Years</th><th class="n">Artifacts</th><th>Basis</th>
  </tr></thead><tbody></tbody></table>
</section>
</div>
<div id="tip" role="tooltip"></div>

<script src="view-timeline.js"></script>
<script>
(function () {
  "use strict";
  DendroViewTimeline.create(document, DendroLoader.load(), {
    meta: document.getElementById("meta")
  });
  document.getElementById("theme").onclick = DendroTheme.toggle;
})();
</script>
