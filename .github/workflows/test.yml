name: test

on: [push, pull_request]

# A suíte só lê o repositório e roda unittest. Sem esta linha o job herda
# o token de escrita padrão, que num repositório público é permissão de
# sobra para qualquer coisa que um pull request de terceiro execute.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: git config --global user.email "test@example.com"
      - run: git config --global user.name "Test"
      - run: python -m unittest discover -s tests -v
